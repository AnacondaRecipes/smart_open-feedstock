{% set name = "smart_open" %}
{% set version = "8.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/piskvorky/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7e922762fd18aec7f4bec53cbaa943e5627d73882fb3c861612e0c1ce928e43f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=64
    - setuptools_scm >=8
  run:
    - python
    - wrapt
  run_constrained:
    # gcs
    - google-cloud-storage >=2.6.0
    - azure-storage-blob >=12.7.0
    - boto3 >=1.9.17
    - backports.zstd >=1.0.0  # [py<314]

test:
  source_files:
    - tests
  imports:
    - smart_open
  commands:
    - pip check
    - set "REQUESTS_CA_BUNDLE="  # [win]
    - set "AWS_CA_BUNDLE="       # [win]
    - unset REQUESTS_CA_BUNDLE AWS_CA_BUNDLE  # [unix]
    - pytest -v tests
  requires:
    - pip
    - pytest
    - pytest-rerunfailures
    - responses
    - azure-storage-blob
    - google-cloud-storage
    - backports.zstd
    - azure-common
    - azure-core
    - paramiko
    - cffi >=2.0.0
    - boto3
    - lz4
    - zstandard
    - moto

about:
  home: https://github.com/RaRe-Technologies/smart_open
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Utils for streaming large files (S3, HDFS, GCS, SFTP, Azure Blob Storage, gzip, bz2, zst...)
  description: |
    smart_open is a Python 3 library for efficient streaming of very large
    files from/to storages such as S3, GCS, Azure Blob Storage, HDFS, WebHDFS,
    HTTP, HTTPS, SFTP, or local filesystem.  It supports transparent,
    on-the-fly (de-)compression for a variety of different formats
  dev_url: https://github.com/RaRe-Technologies/smart_open
  doc_url: https://github.com/RaRe-Technologies/smart_open/blob/develop/README.rst

extra:
  recipe-maintainers:
    - souravsingh
    - mpenkov
  skip-lints:  # [win]
    - missing_pip_check  # [win]
    - missing_tests  # [win]
    - missing_imports_or_run_test_py  # [win]
